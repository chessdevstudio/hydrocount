<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0F5C66" />
<title>Hydratation</title>
<link rel="icon" id="favicon" href="" />
<link rel="manifest" id="manifestLink" href="" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #F2FAF8;
  --surface: #FFFFFF;
  --ink: #0B2B2E;
  --ink-soft: #547274;
  --ocean: #0F5C66;
  --seafoam: #6FD9C4;
  --coral: #FF7A55;
  --danger: #D64545;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  justify-content: center;
  min-height: 100vh;
  padding: 24px 12px;
}

.hydro-root { width: 100%; max-width: 420px; }

.hydro-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.icon-btn {
  background: var(--surface); border: none; width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; color: var(--ocean);
  cursor: pointer; box-shadow: 0 1px 2px rgba(15,92,102,0.12);
}
.icon-btn svg { width: 18px; height: 18px; }

.hero { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 8px; }
.hero-numbers { font-family: 'Fraunces', serif; display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.hero-consumed { font-size: 34px; font-weight: 600; font-style: italic; color: var(--ocean); }
.hero-sep { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--ink-soft); }
.hero-goal { font-size: 18px; color: var(--ink-soft); }

.bottle-wrap { position: relative; width: 150px; height: 225px; transition: transform 0.15s ease; }
.bottle-wrap.pulse { transform: scale(1.04); }
.bottle-svg { width: 100%; height: 100%; }
.fill-rect { fill: var(--seafoam); transition: y 0.6s cubic-bezier(.34,1.4,.64,1); }
.wave { fill: var(--seafoam); }
.wave1 { animation: waveMove 6s linear infinite; opacity: 0.9; }
.wave2 { animation: waveMoveRev 8s linear infinite; opacity: 0.55; }
@keyframes waveMove { from { transform: translateX(0); } to { transform: translateX(-200px); } }
@keyframes waveMoveRev { from { transform: translateX(-200px); } to { transform: translateX(0); } }
.bottle-outline { fill: none; stroke: var(--ocean); stroke-width: 4; }
.bottle-percent {
  position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%);
  font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; color: var(--ocean);
  mix-blend-mode: multiply;
}
.goal-reached {
  margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--ocean);
  background: rgba(111,217,196,0.35); padding: 5px 12px; border-radius: 999px; display: none;
}
.goal-reached.show { display: inline-block; }

.drink-types { display: flex; gap: 6px; margin-top: 18px; }
.dt-btn {
  flex: 1; background: var(--surface); border: 1px solid rgba(15,92,102,0.14); color: var(--ink-soft);
  font-weight: 600; font-size: 12px; padding: 8px 4px; border-radius: 10px; cursor: pointer; font-family: inherit;
}
.dt-btn.active { background: var(--ocean); color: white; border-color: var(--ocean); }

.bottle-select-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.bottle-select-row label { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
.bottle-select-row select {
  flex: 1; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ocean);
  border: 1px solid rgba(15,92,102,0.16); border-radius: 10px; padding: 7px 8px; background: var(--surface);
}

.quick-add { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
.qa-btn {
  background: var(--surface); border: 1px solid rgba(15,92,102,0.14); color: var(--ocean);
  font-weight: 600; font-size: 13px; padding: 10px 6px; border-radius: 12px; cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease; font-family: inherit;
}
.qa-btn:hover { background: rgba(111,217,196,0.25); }
.qa-btn:active { transform: scale(0.96); }
.qa-bottle {
  grid-column: 1 / -1; background: var(--ocean); color: white; border: none;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.qa-bottle:hover { background: #0c4a52; }
.qa-bottle svg { width: 14px; height: 14px; }

.corrections-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 10px; }
.correction-btn, .undo-link {
  background: none; border: none; color: var(--ink-soft); font-size: 12px; text-decoration: underline;
  cursor: pointer; font-family: inherit;
}
.correction-btn:hover, .undo-link:hover { color: var(--danger); }

.stats-row { display: flex; justify-content: space-between; margin-top: 22px; background: var(--surface); border-radius: 16px; padding: 14px 10px; }
.stat { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); font-weight: 600; }
.stat-value { font-size: 16px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 4px; }
.stat-streak { color: var(--coral); }
.stat-streak svg { width: 16px; height: 16px; }

.badges-strip { display: flex; gap: 8px; overflow-x: auto; margin-top: 16px; padding-bottom: 4px; }
.badge {
  flex: none; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
  padding: 7px 10px; border-radius: 999px; background: var(--surface); color: #B9C7C7;
  white-space: nowrap; border: 1px solid rgba(15,92,102,0.08);
}
.badge svg { width: 14px; height: 14px; }
.badge.earned { color: var(--ocean); background: rgba(111,217,196,0.3); }

.challenge { margin-top: 22px; background: var(--surface); border-radius: 16px; padding: 14px 16px; }
.challenge-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.challenge-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
.challenge-note { font-size: 12px; color: var(--ink-soft); }
.challenge-track { width: 100%; height: 8px; border-radius: 999px; background: #E4F3EF; overflow: hidden; }
.challenge-fill { height: 100%; background: var(--coral); border-radius: 999px; transition: width 0.4s ease; }
.challenge-empty { font-size: 13px; color: var(--ink-soft); }

.history { margin-top: 22px; }
.section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
.history-bars { display: flex; justify-content: space-between; align-items: flex-end; height: 90px; margin-top: 10px; gap: 6px; }
.history-col { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; }
.history-bar-track { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.history-bar { width: 60%; min-height: 4px; border-radius: 6px 6px 3px 3px; background: #D7EDE8; transition: height 0.4s ease; }
.history-bar.reached { background: var(--seafoam); }
.history-bar.today { background: var(--ocean); }
.history-day { font-size: 10px; color: var(--ink-soft); margin-top: 6px; font-weight: 600; }

.export-row { margin-top: 16px; text-align: center; }
.export-link {
  background: none; border: none; color: var(--ocean); font-size: 12px; font-weight: 600;
  text-decoration: underline; cursor: pointer; font-family: inherit;
}

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
  background: var(--ocean); color: white; font-size: 13px; font-weight: 600; padding: 10px 18px;
  border-radius: 999px; box-shadow: 0 6px 20px rgba(11,43,46,0.25); opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease; z-index: 100; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.settings-overlay {
  position: fixed; inset: 0; background: rgba(11,43,46,0.45); display: none;
  align-items: flex-end; justify-content: center; z-index: 50; overflow-y: auto;
}
.settings-overlay.show { display: flex; }
.settings-panel { background: var(--surface); width: 100%; max-width: 420px; border-radius: 24px 24px 0 0; padding: 20px 20px 28px; box-sizing: border-box; margin-top: auto; }
.settings-head { display: flex; justify-content: space-between; align-items: center; font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; margin-bottom: 14px; }
.settings-head svg { width: 18px; height: 18px; }
.settings-subhead { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin: 18px 0 10px; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 12px; }
.field input, .field select {
  font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink);
  border: 1px solid rgba(15,92,102,0.16); border-radius: 10px; padding: 9px 10px; background: var(--bg);
  width: 100%; box-sizing: border-box;
}
.checkbox-field { flex-direction: row; align-items: center; gap: 8px; }
.checkbox-field input { width: auto; }
.select-wrap { position: relative; }
.select-wrap select { appearance: none; }
.goal-preview { font-size: 13px; color: var(--ink-soft); background: rgba(111,217,196,0.25); border-radius: 10px; padding: 10px 12px; margin: 6px 0 16px; }
.goal-preview strong { color: var(--ocean); }
.save-btn {
  width: 100%; background: var(--ocean); color: white; border: none; border-radius: 12px;
  padding: 13px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit;
}
.save-btn:hover { background: #0c4a52; }

.bottle-item { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.bottle-item .b-name { flex: 1; }
.bottle-item .b-volume { width: 80px; }
.bottle-item input {
  font-family: 'Inter', sans-serif; font-size: 13px; color: var(--ink); border: 1px solid rgba(15,92,102,0.16);
  border-radius: 8px; padding: 7px 8px; background: var(--bg);
}
.b-delete {
  background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 16px;
  width: 28px; height: 28px; border-radius: 8px; flex: none;
}
.b-delete:hover:not(:disabled) { color: var(--danger); background: rgba(214,69,69,0.1); }
.b-delete:disabled { opacity: 0.3; cursor: not-allowed; }
.add-bottle-btn {
  width: 100%; background: var(--bg); border: 1px dashed rgba(15,92,102,0.3); color: var(--ocean);
  font-weight: 600; font-size: 13px; padding: 9px; border-radius: 10px; cursor: pointer; font-family: inherit; margin-top: 4px;
}

.dnd-row { display: flex; gap: 8px; }
.dnd-row .field { flex: 1; }

.danger-btn {
  width: 100%; background: none; border: 1px solid rgba(214,69,69,0.4); color: var(--danger);
  border-radius: 12px; padding: 11px; font-weight: 700; font-size: 13px; cursor: pointer;
  font-family: inherit; margin-top: 18px;
}
.danger-btn:hover { background: rgba(214,69,69,0.08); }

@media (max-width: 380px) {
  .hydro-root { padding: 0 4px; }
  .quick-add { gap: 6px; }
  .qa-btn { font-size: 12px; padding: 9px 4px; }
  .bottle-wrap { width: 128px; height: 192px; }
  .hero-consumed { font-size: 28px; }
  .stats-row { padding: 12px 4px; }
  .stat-value { font-size: 14px; }
}
</style>
</head>
<body>

<div class="hydro-root">
  <header class="hydro-header">
    <span class="eyebrow">Aujourd'hui</span>
    <button class="icon-btn" id="openSettings" aria-label="Réglages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div class="hero">
    <div class="hero-numbers">
      <span class="hero-consumed" id="consumedLabel">0 mL</span>
      <span class="hero-sep">sur</span>
      <span class="hero-goal" id="goalLabel">0 mL</span>
    </div>

    <div class="bottle-wrap" id="bottleWrap">
      <svg viewBox="0 0 200 300" class="bottle-svg">
        <defs>
          <clipPath id="bottleClip">
            <path d="M78,18 L78,44 Q78,54 68,60 Q44,74 44,102 L44,266 Q44,288 66,288 L134,288 Q156,288 156,266 L156,102 Q156,74 132,60 Q122,54 122,44 L122,18 Z" />
          </clipPath>
        </defs>
        <g clip-path="url(#bottleClip)">
          <rect id="fillRect" x="0" y="288" width="200" height="0" class="fill-rect" />
          <path id="wave1" class="wave wave1" d="M0,10 C25,2 75,18 100,10 C125,2 175,18 200,10 C225,2 275,18 300,10 C325,2 375,18 400,10 L400,30 L0,30 Z" />
          <path id="wave2" class="wave wave2" d="M0,10 C25,18 75,2 100,10 C125,18 175,2 200,10 C225,18 275,2 300,10 C325,18 375,2 400,10 L400,30 L0,30 Z" />
        </g>
        <path d="M78,18 L78,44 Q78,54 68,60 Q44,74 44,102 L44,266 Q44,288 66,288 L134,288 Q156,288 156,266 L156,102 Q156,74 132,60 Q122,54 122,44 L122,18 Z" class="bottle-outline" />
      </svg>
      <span class="bottle-percent" id="percentLabel">0%</span>
    </div>

    <span class="goal-reached" id="goalReached">Objectif atteint aujourd'hui</span>

    <div class="drink-types" id="drinkTypes">
      <button class="dt-btn active" data-type="water">💧 Eau</button>
      <button class="dt-btn" data-type="tea">🍵 Thé</button>
      <button class="dt-btn" data-type="coffee">☕ Café</button>
    </div>

    <div class="bottle-select-row">
      <label for="bottleSelect">Gourde</label>
      <select id="bottleSelect"></select>
    </div>
  </div>

  <div class="quick-add">
    <button class="qa-btn" data-amount="200">+200 mL</button>
    <button class="qa-btn" data-amount="330">+330 mL</button>
    <button class="qa-btn" data-amount="500">+500 mL</button>
    <button class="qa-btn qa-bottle" id="addBottleBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69s-5 5.5-5 9.31a5 5 0 0 0 10 0c0-3.81-5-9.31-5-9.31z"/></svg>
      <span id="bottleBtnLabel">Gourde entière</span>
    </button>
  </div>

  <div class="corrections-row">
    <button class="correction-btn" id="minusBtn">-200 mL</button>
    <button class="undo-link" id="undoBtn" style="display:none;">Annuler la dernière entrée</button>
  </div>

  <div class="stats-row">
    <div class="stat">
      <span class="stat-label">Restant</span>
      <span class="stat-value" id="remainingLabel">0 mL</span>
    </div>
    <div class="stat">
      <span class="stat-label">Série</span>
      <span class="stat-value stat-streak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        <span id="streakLabel">0j</span>
      </span>
    </div>
    <div class="stat">
      <span class="stat-label">Objectifs atteints</span>
      <span class="stat-value" id="totalGoalsLabel">0</span>
    </div>
  </div>

  <div class="badges-strip" id="badgesStrip"></div>

  <section class="challenge" id="challengeCard">
    <div class="challenge-head">
      <span class="challenge-title">Défi de la semaine</span>
      <span class="challenge-note" id="challengeNote"></span>
    </div>
    <div class="challenge-track"><div class="challenge-fill" id="challengeFill" style="width:0%"></div></div>
  </section>

  <section class="history">
    <span class="section-title">7 derniers jours</span>
    <div class="history-bars" id="historyBars"></div>
    <div class="export-row">
      <button class="export-link" id="exportCsvBtn">Exporter l'historique en CSV</button>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <div class="settings-head">
      <span>Réglages</span>
      <button class="icon-btn" id="closeSettings" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <label class="field">
      <span>Poids (kg)</span>
      <input type="number" id="fWeight" min="20" max="300" />
    </label>

    <label class="field">
      <span>Activité physique (min/jour)</span>
      <input type="number" id="fActivity" min="0" max="600" />
    </label>

    <label class="field">
      <span>Climat</span>
      <div class="select-wrap">
        <select id="fClimate">
          <option value="temperate">Tempéré</option>
          <option value="hot">Chaud</option>
          <option value="veryhot">Caniculaire</option>
        </select>
      </div>
    </label>

    <label class="field">
      <span>Unité affichée</span>
      <div class="select-wrap">
        <select id="fUnit">
          <option value="ml">Millilitres (mL)</option>
          <option value="l">Litres (L)</option>
          <option value="oz">Onces (oz)</option>
        </select>
      </div>
    </label>

    <div class="goal-preview">Objectif estimé : <strong id="goalPreview">0 mL</strong> / jour</div>

    <div class="settings-subhead">Mes gourdes</div>
    <div id="bottlesList"></div>
    <button class="add-bottle-btn" id="addBottleSettingsBtn">+ Ajouter une gourde</button>

    <div class="settings-subhead">Rappels</div>
    <label class="field checkbox-field">
      <input type="checkbox" id="fReminderEnabled" />
      <span>Activer les rappels</span>
    </label>
    <label class="field">
      <span>Intervalle</span>
      <div class="select-wrap">
        <select id="fReminderInterval">
          <option value="30">Toutes les 30 min</option>
          <option value="60">Toutes les heures</option>
          <option value="90">Toutes les 1h30</option>
          <option value="120">Toutes les 2h</option>
        </select>
      </div>
    </label>
    <div class="dnd-row">
      <label class="field">
        <span>Silence de</span>
        <div class="select-wrap"><select id="fDndStart"></select></div>
      </label>
      <label class="field">
        <span>à</span>
        <div class="select-wrap"><select id="fDndEnd"></select></div>
      </label>
    </div>

    <button class="save-btn" id="saveSettings">Enregistrer</button>
    <button class="danger-btn" id="resetBtn">Réinitialiser mes données</button>
  </div>
</div>

<script>
const STORAGE_KEY = "hydro-data-v1";
const DEFAULT_PROFILE = {
  weightKg: 70, activityMin: 30, climate: "temperate", unit: "ml",
  bottles: [{ id: "default", name: "Ma gourde", volumeMl: 500 }],
  currentBottleId: "default",
  reminders: { enabled: false, intervalMin: 60, dndStart: 22, dndEnd: 7 },
};
const WEEKDAY_LABELS = ["D","L","M","M","J","V","S"];
const DRINK_RATIOS = { water: 1, tea: 0.9, coffee: 0.85 };
const DRINK_LABELS = { water: "eau", tea: "thé", coffee: "café" };
const MESSAGES = [
  "Bien joué, continue comme ça !",
  "Une gorgée de plus, un pas de plus vers ton objectif.",
  "Ton corps te dit merci.",
  "Petit à petit, l'objectif se remplit.",
  "C'est noté, hydratation en cours.",
  "Belle régularité aujourd'hui.",
];

let profile = structuredClone(DEFAULT_PROFILE);
let days = {};
let logs = {};
let selectedDrinkType = "water";
let reminderTimer = null;

function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      profile = { ...structuredClone(DEFAULT_PROFILE), ...(parsed.profile || {}) };
      if (!profile.bottles || !profile.bottles.length) profile.bottles = structuredClone(DEFAULT_PROFILE.bottles);
      if (!profile.currentBottleId) profile.currentBottleId = profile.bottles[0].id;
      if (!profile.reminders) profile.reminders = structuredClone(DEFAULT_PROFILE.reminders);
      days = parsed.days || {};
      logs = parsed.logs || {};
    }
  } catch (e) {}
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ profile, days, logs })); } catch (e) {}
}

function computeGoalMl(p) {
  const base = p.weightKg * 33;
  const activityBonus = Math.round((p.activityMin / 30) * 350);
  const climateBonus = p.climate === "hot" ? 500 : p.climate === "veryhot" ? 1000 : 0;
  return Math.round(base + activityBonus + climateBonus);
}
function formatVolume(ml, unit) {
  if (unit === "l") return (ml / 1000).toFixed(2).replace(/\.00$/, "") + " L";
  if (unit === "oz") return Math.round(ml * 0.033814) + " oz";
  return Math.round(ml) + " mL";
}
function todayKey(d = new Date()) { return d.toISOString().slice(0, 10); }
function nowTime() { return new Date().toTimeString().slice(0, 5); }
function lastNDays(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); out.push(todayKey(d)); }
  return out;
}
function weekTotal(offsetWeeks) {
  let total = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i - offsetWeeks * 7);
    total += days[todayKey(d)] || 0;
  }
  return total;
}
function isInDnd(hour, start, end) {
  if (start === end) return false;
  if (start < end) return hour >= start && hour < end;
  return hour >= start || hour < end;
}
function pickMessage() { return MESSAGES[Math.floor(Math.random() * MESSAGES.length)]; }

function showToast(text) {
  const toast = document.getElementById("toast");
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
}

function updateFaviconAndTitle(percent) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230F5C66'/><rect y='${32 - percent * 0.3}' width='32' height='${percent * 0.3}' rx='9' fill='%236FD9C4'/></svg>`;
  document.getElementById("favicon").setAttribute("href", "data:image/svg+xml," + svg);
  document.title = percent + "% · Hydratation";
}

function computeStreak(goalMl) {
  let streak = 0;
  let d = new Date();
  const key = todayKey();
  while (true) {
    const k = todayKey(d);
    const val = days[k] || 0;
    if (k === key) {
      if (val >= goalMl) { streak++; d.setDate(d.getDate() - 1); continue; }
      else break;
    }
    if (val >= goalMl) { streak++; d.setDate(d.getDate() - 1); } else break;
  }
  return streak;
}

function renderBottleSelect() {
  const sel = document.getElementById("bottleSelect");
  sel.innerHTML = profile.bottles.map(b => `<option value="${b.id}">${b.name} (${b.volumeMl} mL)</option>`).join("");
  sel.value = profile.currentBottleId;
}

function currentBottle() {
  return profile.bottles.find(b => b.id === profile.currentBottleId) || profile.bottles[0];
}

function render() {
  const goalMl = computeGoalMl(profile);
  const key = todayKey();
  const consumedMl = days[key] || 0;
  const percent = Math.min(100, Math.round((consumedMl / goalMl) * 100));
  const overGoal = consumedMl >= goalMl;

  document.getElementById("consumedLabel").textContent = formatVolume(consumedMl, profile.unit);
  document.getElementById("goalLabel").textContent = formatVolume(goalMl, profile.unit);
  document.getElementById("percentLabel").textContent = percent + "%";
  document.getElementById("remainingLabel").textContent = formatVolume(Math.max(0, goalMl - consumedMl), profile.unit);
  document.getElementById("goalReached").classList.toggle("show", overGoal);
  const bottle = currentBottle();
  document.getElementById("bottleBtnLabel").textContent = bottle.name + " entière (" + bottle.volumeMl + " mL)";
  document.getElementById("undoBtn").style.display = (logs[key] && logs[key].length) ? "block" : "none";

  const bodyTop = 60, bodyBottom = 288;
  const fillY = bodyBottom - (percent / 100) * (bodyBottom - bodyTop);
  document.getElementById("fillRect").setAttribute("y", fillY);
  document.getElementById("fillRect").setAttribute("height", 300 - fillY);
  document.getElementById("wave1").setAttribute("transform", `translate(0, ${fillY - 9})`);
  document.getElementById("wave2").setAttribute("transform", `translate(0, ${fillY - 5})`);

  const streak = computeStreak(goalMl);
  const totalGoalsReached = Object.values(days).filter(v => v >= goalMl).length;
  const hasLoggedOnce = Object.keys(days).length > 0;

  document.getElementById("streakLabel").textContent = streak + "j";
  document.getElementById("totalGoalsLabel").textContent = totalGoalsReached;

  const badges = [
    { label: "Première gorgée", earned: hasLoggedOnce },
    { label: "3 jours d'affilée", earned: streak >= 3 },
    { label: "7 jours d'affilée", earned: streak >= 7 },
    { label: "10 objectifs atteints", earned: totalGoalsReached >= 10 },
  ];
  document.getElementById("badgesStrip").innerHTML = badges.map(b => `
    <div class="badge ${b.earned ? "earned" : ""}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
      <span>${b.label}</span>
    </div>`).join("");

  const week = lastNDays(7);
  const maxDay = Math.max(goalMl, ...week.map(k => days[k] || 0));
  document.getElementById("historyBars").innerHTML = week.map(k => {
    const val = days[k] || 0;
    const h = maxDay > 0 ? Math.max(4, (val / maxDay) * 100) : 4;
    const reached = val >= goalMl;
    const dow = new Date(k + "T00:00:00").getDay();
    return `
      <div class="history-col">
        <div class="history-bar-track">
          <div class="history-bar ${reached ? "reached" : ""} ${k === key ? "today" : ""}" style="height:${h}%" title="${formatVolume(val, profile.unit)}"></div>
        </div>
        <span class="history-day">${WEEKDAY_LABELS[dow]}</span>
      </div>`;
  }).join("");

  const currentWeek = weekTotal(0);
  const prevWeek = weekTotal(1);
  const fillEl = document.getElementById("challengeFill");
  const noteEl = document.getElementById("challengeNote");
  if (prevWeek > 0) {
    const target = prevWeek + 500;
    const pct = Math.min(100, Math.round((currentWeek / target) * 100));
    fillEl.style.width = pct + "%";
    noteEl.textContent = formatVolume(currentWeek, profile.unit) + " / " + formatVolume(target, profile.unit);
  } else {
    fillEl.style.width = "0%";
    noteEl.textContent = "Reviens la semaine prochaine";
  }

  renderBottleSelect();
  updateFaviconAndTitle(percent);
}

function addWater(amountMl) {
  const type = selectedDrinkType;
  const equivalentMl = amountMl * DRINK_RATIOS[type];
  const key = todayKey();
  days[key] = (days[key] || 0) + equivalentMl;
  logs[key] = logs[key] || [];
  logs[key].push({ time: nowTime(), type, amountMl });
  saveData();
  render();
  const wrap = document.getElementById("bottleWrap");
  wrap.classList.add("pulse");
  setTimeout(() => wrap.classList.remove("pulse"), 600);
  showToast(pickMessage());
}
function subtractWater(amountMl) {
  const key = todayKey();
  if (!days[key]) return;
  days[key] = Math.max(0, days[key] - amountMl);
  logs[key] = logs[key] || [];
  logs[key].push({ time: nowTime(), type: "correction", amountMl: -amountMl });
  if (days[key] === 0) delete days[key];
  saveData();
  render();
  showToast("-" + amountMl + " mL corrigés");
}
function undoLast() {
  const key = todayKey();
  if (!logs[key] || !logs[key].length) return;
  const last = logs[key].pop();
  const equivalentMl = last.type === "correction" ? last.amountMl : last.amountMl * DRINK_RATIOS[last.type];
  days[key] = Math.max(0, (days[key] || 0) - equivalentMl);
  if (days[key] === 0) delete days[key];
  if (!logs[key].length) delete logs[key];
  saveData();
  render();
  showToast("Dernière entrée annulée");
}

function exportCSV() {
  const rows = [["date", "heure", "type", "quantite_ml"]];
  Object.keys(logs).sort().forEach(date => {
    logs[date].forEach(e => rows.push([date, e.time, DRINK_LABELS[e.type] || e.type, e.amountMl]));
  });
  const csv = rows.map(r => r.join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "hydratation-historique.csv"; a.click();
  URL.revokeObjectURL(url);
}

function scheduleReminders() {
  if (reminderTimer) clearInterval(reminderTimer);
  if (!profile.reminders.enabled || !("Notification" in window)) return;
  reminderTimer = setInterval(() => {
    const hour = new Date().getHours();
    if (isInDnd(hour, profile.reminders.dndStart, profile.reminders.dndEnd)) return;
    if (Notification.permission === "granted") {
      new Notification("💧 Pense à boire !", { body: pickMessage() });
    }
  }, profile.reminders.intervalMin * 60 * 1000);
}

function renderBottlesList() {
  const el = document.getElementById("bottlesList");
  el.innerHTML = profile.bottles.map(b => `
    <div class="bottle-item" data-id="${b.id}">
      <input type="text" class="b-name" value="${b.name}" />
      <input type="number" class="b-volume" value="${b.volumeMl}" min="50" max="5000" step="50" />
      <button class="b-delete" ${profile.bottles.length <= 1 ? "disabled" : ""} aria-label="Supprimer">✕</button>
    </div>`).join("");
  el.querySelectorAll(".bottle-item").forEach(item => {
    const id = item.dataset.id;
    item.querySelector(".b-name").addEventListener("change", e => {
      const b = profile.bottles.find(x => x.id === id);
      b.name = e.target.value.trim() || "Gourde";
      saveData(); render();
    });
    item.querySelector(".b-volume").addEventListener("change", e => {
      const b = profile.bottles.find(x => x.id === id);
      b.volumeMl = clamp(Number(e.target.value) || 500, 50, 5000);
      e.target.value = b.volumeMl;
      saveData(); render();
    });
    item.querySelector(".b-delete").addEventListener("click", () => {
      if (profile.bottles.length <= 1) return;
      profile.bottles = profile.bottles.filter(x => x.id !== id);
      if (profile.currentBottleId === id) profile.currentBottleId = profile.bottles[0].id;
      saveData(); renderBottlesList(); render();
    });
  });
}

function populateHourSelects() {
  ["fDndStart", "fDndEnd"].forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = Array.from({ length: 24 }, (_, i) => `<option value="${i}">${i}h</option>`).join("");
  });
}

function openSettings() {
  document.getElementById("fWeight").value = profile.weightKg;
  document.getElementById("fActivity").value = profile.activityMin;
  document.getElementById("fClimate").value = profile.climate;
  document.getElementById("fUnit").value = profile.unit;
  document.getElementById("fReminderEnabled").checked = profile.reminders.enabled;
  document.getElementById("fReminderInterval").value = profile.reminders.intervalMin;
  document.getElementById("fDndStart").value = profile.reminders.dndStart;
  document.getElementById("fDndEnd").value = profile.reminders.dndEnd;
  renderBottlesList();
  updateGoalPreview();
  document.getElementById("settingsOverlay").classList.add("show");
}
function closeSettings() { document.getElementById("settingsOverlay").classList.remove("show"); }
function updateGoalPreview() {
  const draft = {
    weightKg: clamp(Number(document.getElementById("fWeight").value) || 70, 20, 300),
    activityMin: clamp(Number(document.getElementById("fActivity").value) || 0, 0, 600),
    climate: document.getElementById("fClimate").value,
    unit: document.getElementById("fUnit").value,
  };
  document.getElementById("goalPreview").textContent = formatVolume(computeGoalMl(draft), draft.unit);
}
async function saveSettings() {
  profile.weightKg = clamp(Number(document.getElementById("fWeight").value) || 70, 20, 300);
  profile.activityMin = clamp(Number(document.getElementById("fActivity").value) || 0, 0, 600);
  profile.climate = document.getElementById("fClimate").value;
  profile.unit = document.getElementById("fUnit").value;

  const reminderEnabled = document.getElementById("fReminderEnabled").checked;
  profile.reminders.intervalMin = Number(document.getElementById("fReminderInterval").value);
  profile.reminders.dndStart = Number(document.getElementById("fDndStart").value);
  profile.reminders.dndEnd = Number(document.getElementById("fDndEnd").value);

  if (reminderEnabled && "Notification" in window) {
    const perm = await Notification.requestPermission();
    profile.reminders.enabled = perm === "granted";
    if (perm !== "granted") showToast("Notifications refusées par le navigateur");
  } else {
    profile.reminders.enabled = false;
  }

  saveData();
  scheduleReminders();
  closeSettings();
  render();
}
function resetAllData() {
  if (!confirm("Supprimer toutes tes données (historique, réglages, gourdes) ? Cette action est irréversible.")) return;
  localStorage.removeItem(STORAGE_KEY);
  profile = structuredClone(DEFAULT_PROFILE);
  days = {}; logs = {};
  closeSettings();
  render();
  showToast("Données réinitialisées");
}

document.querySelectorAll(".qa-btn[data-amount]").forEach(btn => {
  btn.addEventListener("click", () => addWater(Number(btn.dataset.amount)));
});
document.getElementById("addBottleBtn").addEventListener("click", () => addWater(currentBottle().volumeMl));
document.getElementById("minusBtn").addEventListener("click", () => subtractWater(200));
document.getElementById("undoBtn").addEventListener("click", undoLast);
document.getElementById("exportCsvBtn").addEventListener("click", exportCSV);
document.getElementById("bottleSelect").addEventListener("change", e => {
  profile.currentBottleId = e.target.value;
  saveData(); render();
});
document.querySelectorAll(".dt-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    selectedDrinkType = btn.dataset.type;
    document.querySelectorAll(".dt-btn").forEach(b => b.classList.toggle("active", b === btn));
  });
});
document.getElementById("openSettings").addEventListener("click", openSettings);
document.getElementById("closeSettings").addEventListener("click", closeSettings);
document.getElementById("settingsOverlay").addEventListener("click", e => { if (e.target.id === "settingsOverlay") closeSettings(); });
document.getElementById("saveSettings").addEventListener("click", saveSettings);
document.getElementById("resetBtn").addEventListener("click", resetAllData);
document.getElementById("addBottleSettingsBtn").addEventListener("click", () => {
  profile.bottles.push({ id: "b" + Date.now(), name: "Nouvelle gourde", volumeMl: 500 });
  saveData(); renderBottlesList();
});
["fWeight", "fActivity", "fClimate", "fUnit"].forEach(id => {
  document.getElementById(id).addEventListener("input", updateGoalPreview);
  document.getElementById(id).addEventListener("change", updateGoalPreview);
});

// PWA : manifest en data URI + service worker minimal (nécessite un hébergement en http/https pour fonctionner pleinement)
(function setupPWA() {
  const manifest = {
    name: "Hydratation", short_name: "Hydratation", start_url: ".", display: "standalone",
    background_color: "#F2FAF8", theme_color: "#0F5C66",
    icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230F5C66'/%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" }],
  };
  document.getElementById("manifestLink").setAttribute("href", "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest)));
  if ("serviceWorker" in navigator && (location.protocol === "http:" || location.protocol === "https:")) {
    const swCode = "self.addEventListener('fetch', function(){});";
    const blob = new Blob([swCode], { type: "text/javascript" });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  }
})();

loadData();
populateHourSelects();
render();
scheduleReminders();
</script>
</body>
